<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartas Familiares · V0.4</title><style>
*{box-sizing:border-box}#menu{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#263451 0,#111722 48%,#090c12 100%);display:flex;align-items:center;justify-content:center;padding:24px}#menu.hide{display:none}.menuCard{text-align:center;width:min(92vw,430px);padding:42px 25px;border:1px solid #4a5870;border-radius:28px;background:rgba(20,26,38,.88);box-shadow:0 25px 80px #000}.logo{font-size:clamp(38px,11vw,64px);line-height:.92;font-weight:1000;letter-spacing:-2px;text-transform:uppercase}.logo span{display:block;color:#f2c94c}.tag{color:#aeb8ca;margin:16px 0 28px}.startBtn{width:100%;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#2c8a55,#50c878);color:white;font-size:18px;font-weight:900;box-shadow:0 8px 25px rgba(80,200,120,.22)}body{margin:0;background:#0e121a;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}.w{max-width:1050px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;background:#2867d8;color:white;font-weight:800;font:inherit}.alt{background:#343d50}.msg,.z{background:#191e29;border:1px solid #3b4558;border-radius:13px}.msg{padding:10px;margin:10px 0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.z{padding:7px;min-width:0;cursor:pointer}.zn{font-weight:900}.zd{font-size:10px;color:#aeb8ca;min-height:45px}.score{text-align:center;font-size:19px;font-weight:900}.slot{font-size:9px;border:1px solid #3b4558;border-radius:8px;padding:5px;min-height:55px;margin-top:4px}.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.card{background:#242b39;color:white;border:1px solid #3b4558;border-radius:12px;padding:7px;min-height:125px;text-align:left}.card.sel{outline:2px solid #6aa9ff}.stats{display:flex;justify-content:space-between;font-weight:900}.cost{color:#50c878}.power{color:#f2c94c}.cn{font-weight:900;margin-top:12px}.ca{font-size:9px;color:#aeb8ca;margin-top:5px}.muted{font-size:12px;color:#aeb8ca}.title{display:flex;justify-content:space-between;margin:14px 0 6px}@media(max-width:620px){.w{padding:7px}.zn{font-size:11px}.zd{font-size:8px}.slot{font-size:8px}.hand{grid-template-columns:repeat(3,1fr)}.card{min-height:115px}.btn{padding:9px}}

/* V0.4 visual layer */
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#26354d 0,#101620 42%,#080b10 100%);background-attachment:fixed}
.w{max-width:1180px;padding:12px 12px 24px}
.top{padding:10px 12px;border:1px solid #344157;border-radius:18px;background:rgba(13,18,27,.88);box-shadow:0 12px 35px #0008;position:sticky;top:6px;z-index:10;backdrop-filter:blur(12px)}
.btn{cursor:pointer;transition:.18s;box-shadow:inset 0 1px #ffffff20}.btn:active{transform:scale(.97)}
.msg{border-color:#35445d;background:linear-gradient(90deg,#18202e,#121925);box-shadow:0 8px 25px #0005}
.board{gap:10px;perspective:900px}
.z{position:relative;overflow:hidden;min-height:250px;border:1px solid #53627a;background:linear-gradient(160deg,#222c3d,#111722 65%);box-shadow:0 16px 35px #0008;transition:.2s}
.z:hover{transform:translateY(-2px);border-color:#7c8ba5}
.z::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,#ffffff12,transparent 45%);pointer-events:none}
.zn{position:relative;text-align:center;text-transform:uppercase;letter-spacing:.7px;font-size:14px;text-shadow:0 2px 8px #000}
.zd{position:relative;text-align:center;line-height:1.3;padding:5px 2px;color:#c7d0df}
.score{position:relative;width:max-content;min-width:78px;margin:4px auto 8px;padding:5px 10px;border-radius:999px;background:#080c12;border:1px solid #46546a;box-shadow:0 4px 12px #0008}
.slot{position:relative;background:#0d121bcc;border-color:#354158;line-height:1.5;min-height:68px}
.slot b{font-size:8px;letter-spacing:1px;color:#7f91aa}
.title{align-items:center}.title b{font-size:18px}
.hand{gap:9px}
.card{position:relative;overflow:hidden;min-height:175px;border-radius:16px;border:1px solid #56647a;background:linear-gradient(145deg,#303b4e,#151c28 68%);box-shadow:0 12px 25px #0007;cursor:pointer;transition:.18s;padding:10px}
.card::after{content:"";position:absolute;left:0;right:0;top:42px;height:52px;background:linear-gradient(135deg,#ffffff0c,#ffffff02);border-top:1px solid #ffffff0a;border-bottom:1px solid #ffffff08;z-index:0}
.card>*{position:relative;z-index:1}.card:hover{transform:translateY(-5px);border-color:#8192ae}.card.sel{transform:translateY(-8px);outline:3px solid #61a5ff;box-shadow:0 18px 35px #0009,0 0 22px #3d8cff55}
.stats{font-size:18px}.cost,.power{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;text-shadow:0 2px 3px #000}
.cost{background:linear-gradient(145deg,#65d88d,#16733b);box-shadow:0 3px 10px #123}.power{background:linear-gradient(145deg,#ffd95d,#b37a00);box-shadow:0 3px 10px #321}
.cn{font-size:17px;margin-top:54px;text-transform:uppercase;letter-spacing:.4px}.ca{font-size:11px;line-height:1.3;color:#d1d8e5}
#menu{background:radial-gradient(circle at 50% 28%,#354b70 0,#111826 46%,#070a0f 100%)}.menuCard{position:relative;overflow:hidden;border-color:#62728d;background:linear-gradient(155deg,#1d2738ee,#0d121cee);box-shadow:0 30px 100px #000}.menuCard::before{content:"CF";position:absolute;font-weight:1000;font-size:190px;color:#ffffff06;inset:-40px 0 auto 0}.logo{position:relative;text-shadow:0 5px 20px #000}.logo span{background:linear-gradient(90deg,#f0bd32,#ffe581);-webkit-background-clip:text;color:transparent}.startBtn{position:relative;cursor:pointer;transition:.18s}.startBtn:hover{transform:translateY(-2px);filter:brightness(1.08)}
@keyframes revealZone{0%{transform:rotateY(90deg) scale(.9);opacity:.2}100%{transform:rotateY(0) scale(1);opacity:1}}.z.revealed{animation:revealZone .55s ease}
@media(max-width:620px){.w{padding:7px}.top{top:3px}.board{gap:5px}.z{min-height:225px;padding:5px}.zn{font-size:10px}.zd{min-height:49px;font-size:8px}.score{font-size:15px;min-width:58px;padding:4px 7px}.slot{min-height:62px;padding:4px}.hand{display:flex;overflow-x:auto;padding:5px 2px 16px;scroll-snap-type:x proximity}.card{flex:0 0 31%;min-width:105px;min-height:165px;scroll-snap-align:start;padding:7px}.stats{font-size:14px}.cost,.power{width:31px;height:31px}.cn{font-size:12px;margin-top:50px}.ca{font-size:9px}.title{margin-top:12px}}
</style></head><body><section id="menu"><div class="menuCard"><div class="logo">Cartas <span>Familiares</span></div><div class="tag">Personagens conhecidas. Zonas familiares. Uma batalha de cartas.</div><button id="startBtn" class="startBtn">NOVO JOGO</button></div></section><main class="w"><div class="top"><div><b>Turno <span id="t">1</span>/6 · ⚡ <span id="e">1</span>/<span id="em">1</span></b><div class="muted">Ganha 2 das 3 zonas</div></div><div><button class="btn alt" id="new">Nova partida</button> <button class="btn" id="end">Terminar turno</button></div></div><div id="msg" class="msg">Escolhe uma carta e depois uma zona.</div><div id="board" class="board"></div><div class="title"><b>A tua mão</b><span class="muted">Carta → Zona</span></div><div id="hand" class="hand"></div></main><script>
const C=[['Molly',1,2,'Dá +2 a outra personagem tua aqui.'],['Carlota',1,1,'Se jogares aqui no próximo turno, +3.'],['Bruno',2,2,'Quando jogas outra personagem aqui, +1.'],['Nando',2,3,'A próxima personagem custa 1 menos.'],['Diogo',2,4,'Sem habilidade.'],['Pedro',3,5,'As tuas personagens aqui não perdem Poder.'],['Henrique',3,3,'Copia o Poder de outra personagem tua aqui.'],['Fialho',4,5,'Move outra personagem tua daqui.'],['João',4,7,'Se estiver sozinho aqui, +3.'],['André',5,0,'Duplica o teu Poder total aqui.'],['Daniel',5,8,'+2 por cada zona onde estiveres a ganhar.'],['Carolina',6,10,'Se estiveres a perder aqui, +4.']].map((x,i)=>({id:i,n:x[0],c:x[1],p:x[2],a:x[3]}));
const L=[['Galinha Gorda','Personagens aqui têm +2 Poder.','g'],['Bataclã','No fim, a mais forte aqui recebe +3.','b'],['O Stop','Não podes jogar aqui no turno 6.','s'],['Loft','Ao jogar aqui, muda para outra zona.','l'],['ESPAV','Custos 1 e 2 recebem +2 aqui.','e'],['SACOOR','Cartas aqui custam 1 menos.','c'],['O 24','No fim de cada turno, uma carta aqui recebe +1.','o'],['Jardim da Igreja','Máximo 2 personagens por jogador.','j'],['Ramiro','No fim, duplica a personagem mais fraca.','r'],['Carapuções','No turno 4, troca de posição.','x'],['Praia','No fim do turno 5, personagens aqui recebem +2.','p'],['Studio 44','A primeira personagem aqui em cada turno recebe +2.','t']].map(x=>({n:x[0],d:x[1],id:x[2]}));
let G;const q=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
function start(){let d=sh(C),d2=sh(C);G={turn:1,en:1,sel:null,over:false,discount:0,deck:d.slice(4),hand:d.slice(0,4),cd:d2.slice(4),ch:d2.slice(0,4),z:sh(L).slice(0,3).map((x,i)=>({...x,me:[],cpu:[],fm:{},fc:{},reveal:i===0}))};say('A primeira zona foi revelada.');render()}
function say(x){q('#msg').textContent=x}function cap(z){return z.id==='j'?2:4}function cost(c,z,me){return Math.max(0,c.c-(z.reveal&&z.id==='c'?1:0)-(me?G.discount:0))}
function score(z,k){let a=z[k],v=a.reduce((s,x)=>s+x.pow+(z.reveal&&z.id==='g'?2:0)+(z.reveal&&z.id==='e'&&x.c<=2?2:0),0);return a.some(x=>x.id===9)?v*2:v}
function effect(c,z,k){let a=z[k],x={...c,pow:c.p,pt:G.turn};if(c.id===0&&a.length)a[0].pow+=2;if(c.id===6&&a.length)x.pow=Math.max(...a.map(y=>y.pow));if(c.id===8&&!a.length)x.pow+=3;if(c.id===11&&score(z,k)<score(z,k==='me'?'cpu':'me'))x.pow+=4;if(c.id===10)x.pow+=G.z.filter(y=>score(y,k)>score(y,k==='me'?'cpu':'me')).length*2;let f=k==='me'?'fm':'fc';if(z.reveal&&z.id==='t'&&!z[f][G.turn]){x.pow+=2;z[f][G.turn]=1}a.forEach(y=>{if(y.id===2)y.pow++});a.push(x);a.forEach(y=>{if(y.id===1&&y!==x&&y.pt===G.turn-1&&!y.used){y.pow+=3;y.used=1}});if(c.id===3&&k==='me')G.discount=1;if(z.reveal&&z.id==='l'){let o=G.z.filter(y=>y!==z&&y[k].length<cap(y));if(o.length){a.splice(a.indexOf(x),1);o[Math.floor(Math.random()*o.length)][k].push(x)}}}
function legal(c,z,k,en){return cost(c,z,k==='me')<=en&&z[k].length<cap(z)&&!(z.reveal&&z.id==='s'&&G.turn===6)}
function play(i){if(G.sel===null||G.over)return;let c=G.hand[G.sel],z=G.z[i],pay=cost(c,z,true);if(!legal(c,z,'me',G.en)){say('Não podes jogar essa carta nessa zona.');return}let old=G.discount;G.en-=pay;if(old)G.discount=0;effect(c,z,'me');G.hand.splice(G.sel,1);G.sel=null;say(c.n+' foi jogado.');render()}
function cpu(){let en=G.turn,guard=0;while(guard++<9){let o=[];G.ch.forEach((c,ci)=>G.z.forEach(z=>{if(legal(c,z,'cpu',en))o.push({c,ci,z,pay:cost(c,z,false)})}));if(!o.length)break;o.sort((a,b)=>b.c.p-a.c.p+Math.random()*2);let x=o[0];en-=x.pay;effect(x.c,x.z,'cpu');G.ch.splice(x.ci,1)}}
function turnfx(){G.z.forEach(z=>{if(z.id==='o')['me','cpu'].forEach(k=>{if(z[k].length)z[k][Math.floor(Math.random()*z[k].length)].pow++});if(z.id==='p'&&G.turn===5)[...z.me,...z.cpu].forEach(x=>x.pow+=2)})}
function finalfx(){G.z.forEach(z=>['me','cpu'].forEach(k=>{let a=z[k];if(!a.length)return;if(z.id==='b')a.reduce((m,x)=>x.pow>m.pow?x:m,a[0]).pow+=3;if(z.id==='r')a.reduce((m,x)=>x.pow<m.pow?x:m,a[0]).pow*=2}))}
function end(){if(G.over)return;cpu();turnfx();if(G.turn===6){finalfx();G.over=true;let m=0,c=0;G.z.forEach(z=>{let a=score(z,'me'),b=score(z,'cpu');if(a>b)m++;else if(b>a)c++});say(m>c?'🏆 Vitória! Ganhaste '+m+' zonas.':c>m?'CPU venceu '+c+' zonas.':'🤝 Empate.');render();return}G.turn++;G.en=G.turn;G.discount=0;if(G.turn<=3)G.z[G.turn-1].reveal=true;if(G.deck.length)G.hand.push(G.deck.shift());if(G.cd.length)G.ch.push(G.cd.shift());if(G.turn===4){let i=G.z.findIndex(z=>z.id==='x');if(i>=0){let j=i===0?2:0;[G.z[i],G.z[j]]=[G.z[j],G.z[i]]}}G.sel=null;say('Turno '+G.turn+'. Escolhe a tua jogada.');render()}
function render(){q('#t').textContent=G.turn;q('#e').textContent=G.en;q('#em').textContent=G.turn;let b=q('#board');b.innerHTML='';G.z.forEach((z,i)=>{let e=document.createElement('div');e.className='z'+(z.reveal?' revealed':'');if(!z.reveal){e.innerHTML='<div class="zn">🔒 ZONA DESCONHECIDA</div><div class="zd">Joga aqui às cegas. A identidade e o efeito serão revelados no turno '+(i+1)+'.</div><div class="score">'+score(z,'me')+' : '+score(z,'cpu')+'</div><div class="slot"><b>CPU</b><br>'+(z.cpu.map(x=>x.n+' '+x.pow).join(' · ')||'—')+'</div><div class="slot"><b>TU</b><br>'+(z.me.map(x=>x.n+' '+x.pow).join(' · ')||'—')+'</div>';e.addEventListener('click',()=>play(i));b.appendChild(e);return}e.innerHTML='<div class="zn">'+z.n+'</div><div class="zd">'+z.d+'</div><div class="score">'+score(z,'me')+' : '+score(z,'cpu')+'</div><div class="slot"><b>CPU</b><br>'+(z.cpu.map(x=>x.n+' '+x.pow).join(' · ')||'—')+'</div><div class="slot"><b>TU</b><br>'+(z.me.map(x=>x.n+' '+x.pow).join(' · ')||'—')+'</div>';e.addEventListener('click',()=>play(i));b.appendChild(e)});G.z.forEach(z=>{let el=[...b.children][G.z.indexOf(z)];if(z.reveal){let a=score(z,'me'),c=score(z,'cpu');el.style.boxShadow=a>c?'0 16px 35px #0008, inset 0 -4px 0 #39b86b':c>a?'0 16px 35px #0008, inset 0 -4px 0 #d45252':'0 16px 35px #0008, inset 0 -4px 0 #78869a'}});let h=q('#hand');h.innerHTML='';G.hand.forEach((c,i)=>{let e=document.createElement('button');e.type='button';e.className='card'+(G.sel===i?' sel':'');e.disabled=G.over;e.innerHTML='<div class="stats"><span class="cost">⚡'+c.c+'</span><span class="power">◆'+c.p+'</span></div><div class="cn">'+c.n+'</div><div class="ca">'+c.a+'</div>';e.addEventListener('click',()=>{G.sel=i;say('Selecionaste '+c.n+'. Agora toca numa zona.');render()});h.appendChild(e)});q('#end').disabled=G.over}
q('#new').addEventListener('click',()=>{start();q('#menu').classList.add('hide')});q('#end').addEventListener('click',end);q('#startBtn').addEventListener('click',()=>{start();q('#menu').classList.add('hide')});start();
</script></body></html>
